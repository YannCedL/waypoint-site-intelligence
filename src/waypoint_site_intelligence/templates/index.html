<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYPOINT — Site Intelligence & Cadastre Français</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 26, 43, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #10b981;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 10% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .logo-title { font-size: 1.3rem; font-weight: 700; }
        .logo-subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            flex: 1;
        }

        .map-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            min-height: 500px;
        }

        #map { width: 100%; height: 100%; min-height: 500px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label { color: var(--text-muted); }
        .info-val { font-weight: 600; text-align: right; }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">📍</div>
            <div>
                <div class="logo-title">WAYPOINT</div>
                <div class="logo-subtitle">Intelligence Cadastrale & Parcelles IGN</div>
            </div>
        </div>
        <div class="badge">CADASTRE IGN WFS CONNECTED</div>
    </header>

    <div class="layout">
        <div class="map-wrapper">
            <div id="map"></div>
        </div>

        <div class="card">
            <div class="card-title">Fiche Parcelle Cadastrale</div>
            <div class="info-row"><span class="info-label">Identifiant Parcelle</span><span class="info-val" id="pId">-</span></div>
            <div class="info-row"><span class="info-label">Commune</span><span class="info-val" id="pCommune">-</span></div>
            <div class="info-row"><span class="info-label">Section / Numéro</span><span class="info-val" id="pSection">-</span></div>
            <div class="info-row"><span class="info-label">Surface (Contenance)</span><span class="info-val" id="pArea">-</span></div>
            <div class="info-row"><span class="info-label">Statut Propriété</span><span class="info-val" id="pOwner">-</span></div>
            <div style="margin-top:1.5rem; font-size:0.8rem; color:var(--text-muted);">
                Cliquez n'importe où sur la carte de France pour interroger la parcelle cadastrale en temps réel.
            </div>
        </div>
    </div>

    <script>
        let map = L.map('map').setView([48.8566, 2.3522], 16);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: 'IGN Cadastre, OpenStreetMap'
        }).addTo(map);

        let activeMarker = null;

        async function inspecterCoordonnees(lat, lon) {
            if (activeMarker) map.removeLayer(activeMarker);
            activeMarker = L.marker([lat, lon]).addTo(map);

            try {
                const response = await fetch(`/api/v1/parcel?lat=${lat}&lon=${lon}`);
                const contract = await response.json();
                const p = contract.result.parcel;

                document.getElementById('pId').textContent = p.parcel_id || '-';
                document.getElementById('pCommune').textContent = p.commune || '-';
                document.getElementById('pSection').textContent = `${p.section || ''} ${p.numero || ''}`.trim() || '-';
                document.getElementById('pArea').textContent = p.area_m2 ? `${p.area_m2} m²` : '-';
                document.getElementById('pOwner').textContent = p.owner_type || 'Privé';

            } catch (err) {
                console.error("Erreur lors de l'inspection de la parcelle.");
            }
        }

        map.on('click', e => {
            inspecterCoordonnees(e.latlng.lat, e.latlng.lng);
        });

        window.onload = () => inspecterCoordonnees(48.8566, 2.3522);
    </script>
</body>
</html>
